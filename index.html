<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nota Dinas Otomatis | BBPVP Bekasi</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202b26; --muted: #68756e; --line: #d8dfd9;
      --canvas: #edf1ed; --green: #245c46; --green-dark: #183e31;
      --orange: #bd603d; --soft-green: #e5eee8; --danger: #a63d32;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 12px clamp(18px, 4vw, 56px); color: #fff; background: var(--green-dark); border-bottom: 4px solid var(--orange); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #a9c5b4; color: #d6e5db; font: 700 14px Georgia, serif; }
    .brand-name { font: 700 16px Georgia, serif; }
    .brand-subtitle { margin-top: 3px; color: #c4d2c9; font-size: 11px; }
    .topbar-note { color: #d6e1d9; font-size: 12px; }
    main { width: min(1500px, 100%); margin: 0 auto; padding: 28px clamp(16px, 3vw, 42px) 48px; }
    .page-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: var(--orange); font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
    h1 { margin: 5px 0 0; font: 600 27px Georgia, serif; }
    .heading-detail { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4a9a69; }
    .workspace { display: grid; grid-template-columns: minmax(330px, .8fr) minmax(420px, 1.2fr); align-items: start; gap: 22px; }
    .editor, .preview-column { min-width: 0; }
    .section-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 11px; flex-wrap: wrap; }
    .section-bar h2 { margin: 0; font-size: 14px; font-weight: 700; }
    .section-bar span { color: var(--muted); font-size: 11px; }
    .form-section { margin-bottom: 14px; padding: 17px 18px; border: 1px solid var(--line); background: rgba(255,255,255,.82); }
    .form-section h3 { margin: 0 0 14px; color: var(--green); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .55px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 5px; color: #47564e; font-size: 11px; font-weight: 650; }
    input[type=text], input[type=date], textarea { width: 100%; min-height: 37px; padding: 8px 10px; border: 1px solid #cbd4cd; border-radius: 2px; outline: none; color: var(--ink); background: #fff; font-size: 12px; }
    textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
    textarea.short { min-height: 58px; }
    input:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 2px #245c461a; }
    .combo { position: relative; }
    .combo-list { position: absolute; z-index: 30; left: 0; right: 0; top: 100%; margin: 2px 0 0; padding: 0; list-style: none; max-height: 240px; overflow-y: auto; background: #fff; border: 1px solid #cbd4cd; border-radius: 2px; box-shadow: 0 6px 18px #0002; min-width: 240px; }
    .combo-list li { padding: 6px 10px; cursor: pointer; font-size: 12px; line-height: 1.3; border-bottom: 1px solid #eef2ee; }
    .combo-list li strong { display: block; font-weight: 600; }
    .combo-list li small { display: block; color: var(--muted); font-size: 10px; }
    .combo-list li:hover, .combo-list li.on { background: #e8f1ec; }
    .combo-list li.none { cursor: default; color: var(--muted); font-size: 11px; }
    .combo-list li.none:hover { background: #fff; }
    .field-hint { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    .check { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 500; }
    .check input { width: auto; min-height: 0; }
    .attachment-row { position: relative; margin-bottom: 9px; padding: 10px 10px 10px 34px; border: 1px solid #e0e6e1; background: #fbfcfb; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .attachment-row .no { position: absolute; left: 10px; top: 17px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .attachment-row input { min-width: 0; padding: 6px 8px; min-height: 32px; font-size: 11px; }
    .attachment-row .program { grid-column: 1 / 5; }
    .attachment-row .participants { grid-column: 5 / 7; }
    .attachment-row .mak { grid-column: 1 / 4; }
    .attachment-row .date { grid-column: 4 / 7; }
    .attachment-row .lsp { grid-column: 1 / 5; }
    .row-tools { grid-column: 5 / 7; display: flex; gap: 5px; }
    .row-tools button { flex: 1; height: 32px; border: 1px solid #cbd4cd; background: #fff; font-size: 11px; color: var(--green); }
    .row-tools .remove-row { border-color: #e3c9c4; color: var(--danger); }
    .row-tools button:hover { background: var(--soft-green); }
    .row-tools .remove-row:hover { background: #fbefec; }
    .add-row { width: 100%; min-height: 35px; border: 1px dashed #91a99a; color: var(--green); background: transparent; font-size: 11px; font-weight: 650; }
    .add-row:hover { background: var(--soft-green); }
    .preview-column { position: sticky; top: 16px; }
    .preview-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .action-button { min-height: 34px; padding: 0 12px; border: 1px solid var(--green); color: var(--green); background: transparent; font-size: 11px; font-weight: 650; }
    .action-button.primary { color: #fff; background: var(--green); }
    .action-button:hover { filter: brightness(.94); }
    .validation { min-height: 17px; margin: 0 0 8px; color: var(--danger); font-size: 11px; }
    .validation.ok { color: var(--green); }
    .stage { max-height: calc(100vh - 150px); overflow: auto; padding: 14px; background: #dfe5df; border: 1px solid #d0d8d1; }
    .scaler { position: relative; margin: 0 auto 14px; }
    .scaler:last-child { margin-bottom: 0; }
    .scaler > .paper { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

    /* ===== Kertas A4: geometri sama dengan template Word ===== */
    .paper { width: 210mm; min-height: 297mm; padding: 12mm 20mm 10mm 25mm; background: #fff; box-shadow: 0 4px 15px #1e30251a; color: #000; font: 12pt/1.15 Arial, Helvetica, sans-serif; text-align: left; }
    .paper * { font-family: Arial, Helvetica, sans-serif; }
    .document-letterhead { display: flex; align-items: center; gap: 2mm; width: calc(100% + 33mm); margin: 0 0 4mm -18mm; padding-bottom: 1mm; }
    .document-letterhead, .document-letterhead * { font-family: "Arial Narrow", "Liberation Sans Narrow", "Nimbus Sans Narrow", Arial, sans-serif; }
    .document-logo { width: 1.85cm; height: 2.28cm; flex: 0 0 auto; object-fit: contain; }
    .document-divider { width: .22cm; height: 3.59cm; flex: 0 0 auto; border-left: 1.5pt solid #28485b; }
    .document-brand-copy { flex: 1; min-width: 0; line-height: 1.15; font-weight: 700; }
    .document-ministry { font-size: 12pt; font-weight: 400; white-space: nowrap; }
    .document-directorate { margin-top: .4mm; font-size: 13pt; white-space: nowrap; }
    .document-office { margin-top: .4mm; font-size: 16pt; white-space: nowrap; color: #284a61; }
    .document-city { margin-top: .4mm; font-size: 16pt; color: #284a61; }
    .c { text-align: center; }
    .paper-title { margin: 0; font-size: 12pt; font-weight: 700; text-align: center; }
    .document-number { text-align: center; margin: 0 0 1.15em; }
    .meta { display: grid; grid-template-columns: 22.5mm 2.5mm 1fr; line-height: 1.5; margin: 0 0 1.15em; padding-bottom: 0; border-bottom: 1px solid #000; }
    .meta > div:nth-child(3n+1) { grid-column: 1; }
    .meta .value { white-space: pre-wrap; overflow-wrap: anywhere; text-align: justify; }
    .body-copy { text-align: justify; line-height: 1.5; }
    .body-copy p { margin: 0; text-indent: 10mm; }
    .spacer { height: 1.15em; }
    .signature div { white-space: pre-line; }
    .signature { width: 87.4mm; margin: 0 0 0 77.4mm; text-align: center; }
    .signature #pvTtd { text-align: center; }
    .signature .gap { height: 3.45em; }
    .copy-heading { margin: 0 0 0; line-height: 1.2; }
    .copy-list { margin: 0; padding-left: 10mm; line-height: 1.2; }
    .attachment-paper { padding-top: 12mm; }
    .attachment-page-number { text-align: center; margin: 0 0 4mm; }
    .attachment-meta { display: grid; grid-template-columns: 22.5mm 5mm 1fr; width: 89.2mm; margin: 0 0 0 auto; }
    .attachment-label { grid-column: 1 / -1; }
    .attachment-document-title { margin: 7mm 0 4mm; text-align: center; font-size: 12pt; font-weight: 400; line-height: 1.15; white-space: pre-line; }
    .attachment-table { width: 185.2mm; margin-left: -10.1mm; table-layout: fixed; border-collapse: collapse; font-size: 11pt; line-height: 1.15; }
    .attachment-table td, .attachment-table th { padding: 1mm .8mm; border: 1px solid #000; text-align: center; vertical-align: middle; font-weight: 400; overflow-wrap: break-word; }
    .attachment-table th { background: #d9d9d9; height: 10.3mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .attachment-table td:nth-child(2) { text-align: left; }
    .attachment-table tr.section td { border: 0; border-bottom: 1px solid #000; text-align: left; height: 8.2mm; }
    .attachment-table tr.section td:first-child { text-align: center; }


    .tabs { display: flex; gap: 6px; margin: 0 0 20px; flex-wrap: wrap; }
    .tab { padding: 10px 16px; border: 1px solid #bccabf; background: #f7f9f7; color: var(--green); font-size: 12px; font-weight: 650; text-align: left; }
    .tab small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 400; }
    .tab[aria-selected="true"] { background: var(--green); border-color: var(--green); color: #fff; }
    .tab[aria-selected="true"] small { color: #c9dccf; }
    [hidden] { display: none !important; }
    .group-card { margin-bottom: 12px; border: 1px solid #d3dcd5; background: #fbfcfb; }
    .group-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--soft-green); font-size: 12px; font-weight: 700; color: var(--green-dark); }
    .group-body { padding: 12px; }
    .mini { height: 28px; padding: 0 9px; border: 1px solid #cbd4cd; background: #fff; color: var(--green); font-size: 11px; }
    .mini.danger { border-color: #e3c9c4; color: var(--danger); }
    .mini:hover { background: var(--soft-green); }
    .asr { position: relative; margin-top: 8px; padding: 9px 9px 9px 30px; border: 1px solid #e0e6e1; background: #fff; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .asr .no { position: absolute; left: 9px; top: 15px; font-size: 11px; font-weight: 700; color: var(--muted); }
    .asr input { min-width: 0; padding: 6px 8px; min-height: 32px; font-size: 11px; }
    .asr .a-nama { grid-column: 1 / 4; } .asr .a-nip { grid-column: 4 / 7; }
    .asr .a-pangkat { grid-column: 1 / 4; } .asr .a-jabatan { grid-column: 4 / 7; }
    .asr .a-kedudukan { grid-column: 1 / 3; } .asr .a-honor { grid-column: 3 / 5; }
    .asr .a-tools { grid-column: 5 / 7; display: flex; gap: 5px; }
    .asr .a-tools .mini { flex: 1; }
    .mini-label { display: block; margin: 0 0 3px; font-size: 9px; color: var(--muted); font-weight: 600; }
    .asr > div { min-width: 0; }
    .inline-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .note { margin: 0 0 12px; padding: 9px 11px; background: #fff7e8; border: 1px solid #ecd9ad; color: #6b5420; font-size: 11px; line-height: 1.5; }

    /* ===== Pratinjau SK & Surat Tugas (kertas F4 216 x 330 mm) ===== */
    .paper.sk, .paper.st { width: 216mm; min-height: 330mm; line-height: 1.15; }
    .paper.sk *, .paper.st * { font-family: inherit; }
    .paper.sk .document-letterhead, .paper.sk .document-letterhead *, .paper.st .document-letterhead, .paper.st .document-letterhead * { font-family: "Arial Narrow", "Liberation Sans Narrow", "Nimbus Sans Narrow", Arial, sans-serif; }
    .paper.sk { padding: 12.5mm 18mm 10mm 18mm; font: 12pt/1.15 "Bookman Old Style", "URW Bookman", "Bookman", "Palatino Linotype", Georgia, serif; }
    .paper.sk .document-letterhead { margin-left: -12mm; width: calc(100% + 24mm); margin-bottom: 5mm; }
    .sk .tc { text-align: center; }
    .sk .gap { height: 1.15em; }
    .sk .dk { display: grid; grid-template-columns: 47mm 5mm 1fr; line-height: 1.8; }
    .sk .dv { text-align: justify; }
    .sk .it { display: grid; grid-template-columns: 7mm 1fr; }
    .sk .it > span:last-child { text-align: justify; }
    .sk .ttd { margin: 0 0 0 91mm; width: 88mm; line-height: 1.5; }
    .sk .ttd .ph { font: 8pt Arial, sans-serif; text-align: center; margin: 10mm 0; }
    .sk .ttd .nm { text-align: center; }
    .sk .lamp { margin-left: 91mm; width: 88mm; text-align: justify; line-height: 1.5; }
    .sk .grp-info { display: grid; grid-template-columns: 7mm 47mm 5mm 1fr; line-height: 1.5; margin-top: 2mm; }
    .sk table.mt { width: 100%; margin: 3mm 0 5mm; border-collapse: collapse; table-layout: fixed; font-size: 10.5pt; line-height: 1.3; }
    .sk table.mt th, .sk table.mt td { border: 1px solid #000; padding: 1.5mm 1.5mm; text-align: center; font-weight: 400; vertical-align: middle; overflow-wrap: break-word; }
    .sk table.mt td.l { text-align: left; }
    .paper.st { padding: 5mm 25.4mm 8mm; font: 11pt/1.15 Arial, Helvetica, sans-serif; }
    .paper.st .document-letterhead { margin-left: -19mm; width: calc(100% + 38mm); margin-bottom: 3mm; align-items: center; }
    .st .document-ministry { font-size: 12pt; } 
    .st .document-brand-copy { line-height: 1.1; }
    .st .document-address { font-size: 9pt; font-weight: 400; white-space: nowrap; margin-top: 1mm; letter-spacing: -.1px; }
    .st .document-contact { font-size: 9pt; font-weight: 400; white-space: nowrap; margin-top: 1mm; display: flex; gap: 14px; align-items: center; }
    .st .document-contact img { height: 10px; width: auto; vertical-align: -1px; margin-right: 3px; }
    .st .st-title { text-align: center; letter-spacing: .35em; margin-top: 1mm; }
    .st .st-no { text-align: center; margin-bottom: 4mm; }
    .st .st-title.ul { font-weight: 700; text-decoration: underline; }
    .st .kp { display: grid; grid-template-columns: 40mm 4mm 1fr; }
    .st .kp-wrap { padding-left: 7.6mm; }
    .st .sr { display: grid; grid-template-columns: 26.6mm 5mm 1fr; margin-bottom: 1mm; }
    .st .sv { text-align: justify; }
    .st .sn { display: grid; grid-template-columns: 7.6mm 1fr; }
    .st .sn > span:last-child { text-align: justify; }
    .st .mem { text-align: center; margin: 1mm 0 1mm; }
    .st .sign { display: flex; justify-content: space-between; align-items: flex-start; gap: 6mm; margin-top: 4mm; }
    .st .sign-left { width: 95mm; padding-top: 4mm; }
    .st .sign-left img { width: 16mm; height: 16mm; image-rendering: pixelated; display: block; }
    .st .txid { font-size: 6pt; color: #2a4cb4; margin-bottom: 8mm; }
    .st .box { border: 1px solid #000; padding: 1mm 1.5mm; font-size: 10pt; line-height: 1.2; }
    .st .sign-right { width: 80mm; text-align: center; }
    .st .sign-right .gapx { height: 10mm; }
    .st .sign-right .gap-before { height: 10mm; }
    .st .sign-right .signature-placeholder { display: block; }
    .paper.stp-page2 { min-height: 346mm; }
    .paper.st.st2 { padding: 8mm 12.7mm 10mm; }
    .st .pgno { text-align: center; margin-bottom: 4mm; }
    .st .lmeta { display: grid; grid-template-columns: 23mm 3mm 1fr; margin: 0 0 5mm 100mm; line-height: 1.3; }
    .st .lmeta .lab { grid-column: 1 / -1; }
    .st .ltitle { text-align: center; margin: 0 0 5mm; }
    .st table.mt { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 10pt; line-height: 1.3; }
    .st table.mt th, .st table.mt td { border: 1px solid #000; padding: 1.5mm; text-align: center; font-weight: 400; vertical-align: middle; overflow-wrap: break-word; }
    .st table.mt td.l { text-align: left; }
    .st .sign2 { width: 80mm; margin: 12mm 0 0 auto; text-align: center; }
    .st .sign2 .gapx { height: 6mm; }
    .st .sign2 .gap-before { height: 10mm; }
    .st .sign2 .gap-after { height: 10mm; }
    .st .sign2 .signature-placeholder { display: block; }
    .sk .ttd, .st .sign, .st .sign2, .sk table.mt tr { break-inside: avoid; }
    .pp-nota { } .pp-sk { } .pp-st1 { } .pp-st2 { }

    @media (max-width: 960px) { .workspace { grid-template-columns: 1fr; } .preview-column { position: static; } .stage { max-height: none; } }
    @media (max-width: 540px) {
      .topbar { padding: 12px 14px; } .topbar-note { display: none; } main { padding: 20px 12px 32px; }
      .page-heading { align-items: start; flex-direction: column; } h1 { font-size: 23px; }
      .form-section { padding: 14px 12px; } .field-grid { grid-template-columns: 1fr; } .field.wide { grid-column: auto; }
      .preview-actions { width: 100%; } .preview-actions button { flex: 1; } .stage { padding: 8px; }
    }
    @media print {
      body { background: #fff; }
      .topbar, .page-heading, .editor, .section-bar, .validation, .tabs { display: none !important; }
      main { width: auto; padding: 0; } .workspace { display: block; } .preview-column { position: static; }
      .stage { max-height: none; overflow: visible; padding: 0; border: 0; background: #fff; }
      .scaler { width: auto !important; height: auto !important; margin: 0; }
      .scaler > .paper { position: static; transform: none !important; width: auto; min-height: 0; box-shadow: none; }
      .scaler > .paper.nota { padding: 0 15mm 0 20mm; }
      .scaler > .paper.sk { padding: 0 13mm; }
      .scaler > .paper.st1 { padding: 0 20.4mm; }
      .scaler > .paper.st2 { padding: 0 7.7mm; }
      .scaler > .paper.stp-page2 { padding: 0 20.4mm; }
      .topbar, .tabs { display: none !important; }
      .scaler.attachment { break-before: page; page-break-before: always; }
      .document-logo { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .attachment-table tr { break-inside: avoid; }
      .attachment-table thead { display: table-header-group; }
    }
  </style>
</head>

  <div id="root"></div>
